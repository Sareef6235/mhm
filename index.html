<!doctype html>
<html lang="ml">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>നിസ്കാരം ട്രാക്കർ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              islamic: {
                primary: '#0f766e',
                accent: '#d4a017',
                soft: '#f8fafc',
              },
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: 0, transform: 'translateY(6px)' },
                '100%': { opacity: 1, transform: 'translateY(0)' },
              },
            },
            animation: {
              'fade-in': 'fadeIn 0.35s ease-out',
            },
          },
        },
      };
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
  </head>
  <body class="bg-slate-100 text-slate-800">
    <main class="max-w-lg mx-auto min-h-screen pb-28 px-4 pt-4" id="app"></main>

    <nav class="fixed bottom-0 left-0 right-0 z-20 bg-white/95 backdrop-blur border-t border-slate-200">
      <div class="max-w-lg mx-auto grid grid-cols-4 gap-1 p-2 text-xs" id="bottom-nav"></div>
    </nav>

    <script>
      const state = {
        selectedClass: 'എല്ലാ ക്ലാസുകളും',
        selectedTrackerClass: null,
        trackerPrayer: {
          Subah: false,
          Dhuhr: false,
          Asr: false,
          Maghrib: false,
          Isha: false,
        },
        historyFilter: {
          class: 'എല്ലാ ക്ലാസുകളും',
          date: '2026-03-11',
          student: 'എല്ലാവരും',
        },
      };

      const leaderboardWeek = [
        { name: 'Stu 2', points: 38, salawat: 210 },
        { name: 'Stu 1', points: 34, salawat: 170 },
        { name: 'Abid', points: 31, salawat: 140 },
      ];

      const leaderboardMonth = [
        { name: 'Stu 2', points: 148, salawat: 860 },
        { name: 'Stu 1', points: 142, salawat: 740 },
        { name: 'Abid', points: 136, salawat: 690 },
      ];

      const historyRecords = [
        {
          student: 'Stu 2',
          class: '2',
          date: '2026-03-11',
          points: 6,
          salawat: 50,
          prayers: {
            Subah: 'done',
            Dhuhr: 'done',
            Asr: 'partial',
            Maghrib: 'done',
            Isha: 'done',
          },
        },
        {
          student: 'Stu 1',
          class: '1',
          date: '2026-03-10',
          points: 5,
          salawat: 35,
          prayers: {
            Subah: 'done',
            Dhuhr: 'partial',
            Asr: 'done',
            Maghrib: 'done',
            Isha: 'not',
          },
        },
      ];

      const navItems = [
        { label: 'ഹോം', hash: '#/', icon: 'house' },
        { label: 'ട്രാക്കർ', hash: '#/tracker', icon: 'scroll-text' },
        { label: 'ഹിസ്റ്ററി', hash: '#/history', icon: 'history' },
        { label: 'പ്രൊഫൈൽ', hash: '#/profile', icon: 'user-round' },
      ];

      const prayers = ['Subah', 'Dhuhr', 'Asr', 'Maghrib', 'Isha'];
      const iconClass = 'w-4 h-4';

      function pointsFromPrayer() {
        return Object.values(state.trackerPrayer).filter(Boolean).length;
      }

      function route() {
        const hash = window.location.hash || '#/';
        renderNav(hash);
        if (hash === '#/tracker') return renderTracker();
        if (hash === '#/history') return renderHistory();
        if (hash === '#/profile') return renderProfile();
        return renderHome();
      }

      function renderNav(activeHash) {
        const nav = document.getElementById('bottom-nav');
        nav.innerHTML = navItems
          .map((item) => {
            const active = activeHash === item.hash;
            return `<a href="${item.hash}" class="flex flex-col items-center gap-1 rounded-xl py-2 transition ${
              active ? 'bg-emerald-50 text-islamic-primary' : 'text-slate-500 hover:bg-slate-100'
            }">
              <i data-lucide="${item.icon}" class="${iconClass}"></i>
              <span class="text-xs font-medium">${item.label}</span>
            </a>`;
          })
          .join('');
        lucide.createIcons();
      }

      function renderCardTitle(title, icon) {
        return `<h3 class="text-sm font-semibold flex items-center gap-2 text-slate-700"><i data-lucide="${icon}" class="w-4 h-4 text-islamic-primary"></i>${title}</h3>`;
      }

      function renderHome() {
        const app = document.getElementById('app');
        app.innerHTML = `
          <section class="space-y-4 animate-fade-in">
            <header class="bg-gradient-to-br from-emerald-600 to-teal-700 text-white rounded-2xl p-5 shadow-sm">
              <h1 class="text-xl font-bold">🕌 നിസ്കാരം ട്രാക്കർ</h1>
              <p class="text-xs text-emerald-100 mt-1">Daily Prayer & Study Tracker</p>
            </header>

            <div class="bg-white rounded-2xl shadow-sm p-4">
              <p class="text-xs text-slate-500">ഇന്നത്തെ തിയതി</p>
              <p class="text-sm font-semibold mt-1">മാർച്ച് 11, ബുധനാഴ്‌ച</p>
            </div>

            <div class="bg-white rounded-2xl shadow-sm p-4 space-y-2">
              <label class="text-xs text-slate-500">ക്ലാസ് ഫിൽട്ടർ</label>
              <select id="home-class-filter" class="w-full rounded-xl border-slate-200 text-sm focus:ring-emerald-400 focus:border-emerald-400">
                ${['എല്ലാ ക്ലാസുകളും', '1', '2']
                  .map((c) => `<option ${state.selectedClass === c ? 'selected' : ''}>${c}</option>`)
                  .join('')}
              </select>
            </div>

            <div class="bg-white rounded-2xl shadow-sm p-4 space-y-3">
              ${renderCardTitle('ഇന്നത്തെ ടോപ്പർ 🏆', 'trophy')}
              <div class="rounded-xl bg-emerald-50 p-3 flex justify-between items-center">
                <div>
                  <p class="text-sm font-semibold">🏆 Stu 2</p>
                  <p class="text-xs text-slate-500">Top of the day</p>
                </div>
                <div class="text-right space-y-1">
                  <span class="inline-block text-xs px-2 py-1 rounded-full bg-islamic-primary text-white">6 pt</span>
                  <span class="inline-block text-xs px-2 py-1 rounded-full bg-amber-100 text-amber-700">✨ 50</span>
                </div>
              </div>
            </div>

            <div class="bg-white rounded-2xl shadow-sm p-4 space-y-2">
              ${renderCardTitle('ആഴ്ചയിലെ 📅', 'calendar-days')}
              ${leaderboardWeek
                .map(
                  (item, idx) => `<div class="flex justify-between items-center rounded-xl p-2 ${
                    idx === 0 ? 'bg-amber-50' : 'bg-slate-50'
                  }">
                    <p class="text-sm">${['🥇', '🥈', '🥉'][idx]} ${item.name}</p>
                    <div class="text-xs text-slate-600 flex gap-2"><span>${item.points} pt</span><span>✨ ${item.salawat}</span></div>
                  </div>`
                )
                .join('')}
            </div>

            <div class="bg-white rounded-2xl shadow-sm p-4 space-y-2">
              ${renderCardTitle('മാസത്തിലെ 📆', 'calendar')}
              ${leaderboardMonth
                .map(
                  (item, idx) => `<div class="flex justify-between items-center rounded-xl p-2 ${
                    idx === 0 ? 'bg-amber-50' : 'bg-slate-50'
                  }">
                    <p class="text-sm">${['🥇', '🥈', '🥉'][idx]} ${item.name}</p>
                    <div class="text-xs text-slate-600 flex gap-2"><span>${item.points} pt</span><span>✨ ${item.salawat}</span></div>
                  </div>`
                )
                .join('')}
            </div>

            <footer class="text-center text-xs text-slate-500 py-4">
              <p>© 2026 Zyn</p>
              <p>Designed by Zainul Abid Himami</p>
              <a href="https://instagram.com/zainul_abid_himami" class="text-islamic-primary underline" target="_blank" rel="noreferrer">Instagram</a>
            </footer>
          </section>
        `;

        document.getElementById('home-class-filter').addEventListener('change', (e) => {
          state.selectedClass = e.target.value;
        });
        lucide.createIcons();
      }

      function renderTracker() {
        const app = document.getElementById('app');
        app.innerHTML = `
          <section class="space-y-4 animate-fade-in">
            <header class="bg-white rounded-2xl shadow-sm p-4">
              <h2 class="text-base font-bold">📿 നമസ്കാരം രേഖപ്പെടുത്തുക</h2>
              <p class="text-xs text-slate-500 mt-1">Step 1: Select class</p>
            </header>

            <div class="grid grid-cols-2 gap-3">
              ${['2', '1', 'മറ്റു ക്ലാസുകൾ ആഡ് ചെയ്യാവുന്നതാണ്']
                .map(
                  (c, idx) => `<button data-class="${c}" class="tracker-class ${
                    c === state.selectedTrackerClass ? 'ring-2 ring-emerald-500' : ''
                  } ${idx === 2 ? 'col-span-2' : ''} rounded-2xl shadow-sm bg-white p-4 text-left transition hover:scale-[1.02] active:scale-95">
                    <div class="flex items-center gap-2">
                      <i data-lucide="book-open-check" class="w-4 h-4 text-islamic-primary"></i>
                      <p class="text-sm font-semibold">${c}</p>
                    </div>
                  </button>`
                )
                .join('')}
            </div>

            ${
              state.selectedTrackerClass
                ? `<div class="bg-white rounded-2xl shadow-sm p-4 space-y-3">
                    <p class="text-sm font-semibold">ക്ലാസ്: ${state.selectedTrackerClass}</p>
                    ${prayers
                      .map(
                        (prayer) => `<button data-prayer="${prayer}" class="prayer-toggle w-full flex justify-between items-center rounded-xl p-3 transition hover:scale-[1.01] active:scale-95 ${
                          state.trackerPrayer[prayer]
                            ? 'bg-emerald-100 text-emerald-700'
                            : 'bg-slate-100 text-slate-700'
                        }">
                          <span class="text-sm">${prayer}</span>
                          <span class="text-xs">${state.trackerPrayer[prayer] ? '✅ പൂർത്തിയായി' : '+1 pt'}</span>
                        </button>`
                      )
                      .join('')}
                    <div class="rounded-xl bg-teal-50 p-3 text-xs text-teal-700">Total Points: <span class="font-semibold">${pointsFromPrayer()} pt</span></div>
                  </div>`
                : '<div class="text-xs text-slate-500 px-1">ഒരു ക്ലാസ് തിരഞ്ഞെടുക്കുക.</div>'
            }
          </section>
        `;

        document.querySelectorAll('.tracker-class').forEach((btn) => {
          btn.addEventListener('click', () => {
            state.selectedTrackerClass = btn.getAttribute('data-class');
            renderTracker();
          });
        });

        document.querySelectorAll('.prayer-toggle').forEach((btn) => {
          btn.addEventListener('click', () => {
            const prayer = btn.getAttribute('data-prayer');
            state.trackerPrayer[prayer] = !state.trackerPrayer[prayer];
            renderTracker();
          });
        });
        lucide.createIcons();
      }

      function badgeColor(status) {
        if (status === 'done') return 'bg-emerald-100 text-emerald-700';
        if (status === 'partial') return 'bg-amber-100 text-amber-700';
        return 'bg-slate-200 text-slate-600';
      }

      function renderHistory() {
        const app = document.getElementById('app');
        const filtered = historyRecords.filter((item) => {
          const classOk = state.historyFilter.class === 'എല്ലാ ക്ലാസുകളും' || state.historyFilter.class === item.class;
          const dateOk = !state.historyFilter.date || state.historyFilter.date === item.date;
          const studentOk = state.historyFilter.student === 'എല്ലാവരും' || state.historyFilter.student === item.student;
          return classOk && dateOk && studentOk;
        });

        app.innerHTML = `
          <section class="space-y-4 animate-fade-in">
            <header class="bg-white rounded-2xl shadow-sm p-4">
              <h2 class="text-base font-bold">📜 ഹിസ്റ്ററി</h2>
            </header>

            <div class="bg-white rounded-2xl shadow-sm p-4 space-y-2 text-sm">
              <select id="history-class" class="w-full rounded-xl border-slate-200 text-sm">
                ${['എല്ലാ ക്ലാസുകളും', '1', '2'].map((c) => `<option ${state.historyFilter.class === c ? 'selected' : ''}>${c}</option>`).join('')}
              </select>
              <input id="history-date" type="date" value="${state.historyFilter.date}" class="w-full rounded-xl border-slate-200 text-sm" />
              <select id="history-student" class="w-full rounded-xl border-slate-200 text-sm">
                ${['എല്ലാവരും', 'Stu 1', 'Stu 2', 'Abid']
                  .map((s) => `<option ${state.historyFilter.student === s ? 'selected' : ''}>${s}</option>`)
                  .join('')}
              </select>
            </div>

            ${filtered
              .map(
                (record) => `<article class="bg-white rounded-2xl shadow-sm p-4 space-y-3">
                  <div class="flex justify-between">
                    <div>
                      <p class="text-sm font-semibold">${record.student}</p>
                      <p class="text-xs text-slate-500">${record.date}</p>
                    </div>
                    <div class="text-right">
                      <p class="text-xs font-semibold text-islamic-primary">${record.points} pt</p>
                      <p class="text-xs text-amber-600">✨ ${record.salawat}</p>
                    </div>
                  </div>
                  <div class="flex gap-2 overflow-x-auto pb-1">
                    ${prayers
                      .map(
                        (p) => `<span class="text-xs whitespace-nowrap px-2 py-1 rounded-full ${badgeColor(record.prayers[p])}">${p}</span>`
                      )
                      .join('')}
                  </div>
                </article>`
              )
              .join('')}
          </section>
        `;

        document.getElementById('history-class').addEventListener('change', (e) => {
          state.historyFilter.class = e.target.value;
          renderHistory();
        });
        document.getElementById('history-date').addEventListener('change', (e) => {
          state.historyFilter.date = e.target.value;
          renderHistory();
        });
        document.getElementById('history-student').addEventListener('change', (e) => {
          state.historyFilter.student = e.target.value;
          renderHistory();
        });
      }

      function renderProfile() {
        const app = document.getElementById('app');
        app.innerHTML = `
          <section class="space-y-4 animate-fade-in">
            <div class="bg-white rounded-2xl shadow-sm p-5 text-center">
              <i data-lucide="circle-user-round" class="w-10 h-10 text-islamic-primary mx-auto"></i>
              <h2 class="text-base font-semibold mt-2">പ്രൊഫൈൽ</h2>
              <p class="text-xs text-slate-500 mt-1">Student profile and settings coming soon.</p>
            </div>
            <footer class="text-center text-xs text-slate-500 py-4">
              <p>© 2026 Zyn</p>
              <p>Designed by Zainul Abid Himami</p>
              <a href="https://instagram.com/zainul_abid_himami" class="text-islamic-primary underline" target="_blank" rel="noreferrer">Instagram</a>
            </footer>
          </section>
        `;
        lucide.createIcons();
      }

      window.addEventListener('hashchange', route);
      route();
    </script>
  </body>
</html>
